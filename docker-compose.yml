version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: apex_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: route
      MYSQL_DATABASE: apex_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # This automatically runs the schema.sql file when the DB is created for the first time
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./server
    container_name: apex_backend
    restart: always
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=route
      - DB_NAME=apex_db
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build: .
    container_name: apex_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
